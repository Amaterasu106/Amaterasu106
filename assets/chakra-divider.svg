<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 64" width="100%" height="64">
  <defs>
    <radialGradient id="rasenganCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#38BDF8" />
      <stop offset="80%" stop-color="#0284C7" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="lineLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="lineRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0" />
    </linearGradient>
  </defs>

  
  <line x1="40" y1="32" x2="412" y2="32" stroke="url(#lineLeft)" stroke-width="2" stroke-dasharray="10 6">
    <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.2s" repeatCount="indefinite" />
  </line>
  <line x1="488" y1="32" x2="860" y2="32" stroke="url(#lineRight)" stroke-width="2" stroke-dasharray="10 6">
    <animate attributeName="stroke-dashoffset" from="0" to="32" dur="1.2s" repeatCount="indefinite" />
  </line>

  
  <g transform="translate(450, 32)">
    <circle r="26" fill="url(#rasenganCore)">
      <animate attributeName="r" values="23;27;23" dur="1.6s" repeatCount="indefinite" />
    </circle>

    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.8s" repeatCount="indefinite" />
      <ellipse rx="19" ry="7" fill="none" stroke="#E0F2FE" stroke-width="1.6" />
      <ellipse rx="19" ry="7" transform="rotate(60)" fill="none" stroke="#7DD3FC" stroke-width="1.6" />
      <ellipse rx="19" ry="7" transform="rotate(120)" fill="none" stroke="#38BDF8" stroke-width="1.6" />
    </g>

    <circle r="6" fill="#FFFFFF" />
  </g>
</svg>